<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!--
    リンクを貼ったときに出る画像の元（#114）。
    これ自体は配信しない。public/og-image.jpg に書き出したものを使う。
    書き出し方と、なぜこの形なのかは docs/og-image.md に書いてある。

    中身は横 285〜915（高さと同じ630の正方形）に収めること。
    受け取る側のアプリが正方形に切ることがあり、横に広げると右が落ちる。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1a6b7a"/>
      <stop offset="1" stop-color="#2f8fc4"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- favicon と同じ木。64のviewBoxを200px幅にして中央へ置く -->
  <g transform="translate(500, 110) scale(3.125)">
    <path d="M32 54
             L32 36
             C32 32 30 30 27 27
             C24 24 21 23 18 19
             M32 36
             C32 32 34 29 37 26
             C40 23 43 22 46 18
             M27 27
             C25 25 23 24 21 24
             M37 26
             C39 24 41 23 43 23"
          fill="none" stroke="#ffffff" stroke-width="3.4"
          stroke-linecap="round" stroke-linejoin="round"/>

    <circle cx="17" cy="18" r="4" fill="#f07a1f"/>
    <circle cx="21" cy="23" r="4" fill="#f07a1f"/>
    <circle cx="24" cy="14" r="4" fill="#f07a1f"/>
    <circle cx="43" cy="22" r="4" fill="#f07a1f"/>
    <circle cx="47" cy="17" r="4" fill="#f07a1f"/>
    <circle cx="40" cy="13" r="4" fill="#f07a1f"/>
    <circle cx="46" cy="27" r="4" fill="#f07a1f"/>

    <ellipse cx="14" cy="14" rx="3" ry="1.6" fill="#4caf50" transform="rotate(-30 14 14)"/>
    <ellipse cx="25" cy="9" rx="3" ry="1.6" fill="#4caf50" transform="rotate(20 25 9)"/>
    <ellipse cx="20" cy="19" rx="2.6" ry="1.4" fill="#4caf50" transform="rotate(-10 20 19)"/>
    <ellipse cx="41" cy="8" rx="3" ry="1.6" fill="#4caf50" transform="rotate(-20 41 8)"/>
    <ellipse cx="49" cy="13" rx="3" ry="1.6" fill="#4caf50" transform="rotate(25 49 13)"/>
    <ellipse cx="43" cy="18" rx="2.6" ry="1.4" fill="#4caf50" transform="rotate(10 43 18)"/>
  </g>

  <text x="600" y="425" text-anchor="middle"
        font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"
        font-size="96" font-weight="700" fill="#ffffff">輪講</text>
  <text x="600" y="487" text-anchor="middle"
        font-family="Hiragino Sans, Hiragino Kaku Gothic ProN, sans-serif"
        font-size="32" font-weight="400" fill="#d8ecf7">研究室の輪講を記録して共有する</text>
</svg>
