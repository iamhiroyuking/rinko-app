# XcodeGen 用の定義。Xcodeプロジェクト(.xcodeproj)は生成物なので、
# 中身が読めないXML巨大ファイルをリポジトリに置かずに済む。
#
#   brew install xcodegen && xcodegen generate --spec ios/RinkoApp/project.yml
name: RinkoApp
options:
  bundleIdPrefix: app.rinko
  deploymentTarget:
    iOS: "17.0"
# 鍵は Secrets.xcconfig から流し込む。リポジトリには入れない
# （ios/Secrets.xcconfig.example をコピーして作る）
configs:
  Debug: debug
  Release: release

packages:
  RinkoCore:
    path: ../RinkoCore
targets:
  RinkoApp:
    type: application
    platform: iOS
    sources: [RinkoApp]
    dependencies:
      - package: RinkoCore
        product: RinkoCore
      - package: RinkoCore
        product: RinkoSupabase
    configFiles:
      Debug: ../Secrets.xcconfig
      Release: ../Secrets.xcconfig
    settings:
      base:
        # Assets.xcassets の AppIcon.appiconset を使う。単一の1024pxを
        # 置くだけで、Xcodeが各サイズを生成する（iOS 17+の単一サイズ運用）
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: RinkoApp/Info.plist
      properties:
        CFBundleDisplayName: 輪講
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # xcconfig が値の中の `//` をコメントとして食べるので、
        # スキームとホストを分けて受け取り、ここで組み立てる
        SUPABASE_URL: $(SUPABASE_SCHEME)://$(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # 招待リンクの参加とパスワード再設定に使う。
        # `rinko://join/<token>` と `rinko://reset-password` を受ける
        CFBundleURLTypes:
          - CFBundleURLSchemes: [rinko]
        # 標準のTLS（Supabaseとの通信）以外の独自暗号は使っていない。
        # これが無いと、提出のたびに輸出コンプライアンスの質問に
        # 手で答える必要がある
        ITSAppUsesNonExemptEncryption: false
